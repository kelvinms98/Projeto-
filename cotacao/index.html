<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cotação Export</title>
    <meta
      name="description"
      content="Sistema simples de cotação de exportação para calcular FOB, CIF, frete, imposto e total em reais."
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Painel de exportação</p>
          <h1>Cotação Export</h1>
        </div>
        <div class="topbar-actions">
          <button id="resetBtn" class="secondary" type="button">Limpar</button>
          <button id="printBtn" class="primary" type="button">Imprimir PDF</button>
        </div>
      </header>

      <main class="main-layout">
        <section class="panel form-panel">
          <h2>Dados da cotação</h2>

          <form id="quoteForm">
            <div class="grid">
              <label>
                <span>Cliente</span>
                <input id="clientName" type="text" placeholder="Ex: ABC Comércio" required />
              </label>

              <label>
                <span>Produto</span>
                <input id="productName" type="text" placeholder="Ex: Camisa Premium" required />
              </label>

              <label>
                <span>Quantidade</span>
                <input id="quantity" type="number" min="1" value="1" required />
              </label>

              <label>
                <span>Valor unitário (USD)</span>
                <input id="unitPrice" type="number" min="0" step="0.01" value="25" required />
              </label>

              <label>
                <span>Frete (USD)</span>
                <input id="freight" type="number" min="0" step="0.01" value="150" />
              </label>

              <label>
                <span>Seguro (%)</span>
                <input id="insuranceRate" type="number" min="0" step="0.01" value="1.5" />
              </label>

              <label>
                <span>Taxa de exportação (%)</span>
                <input id="exportTax" type="number" min="0" step="0.01" value="2.5" />
              </label>

              <label>
                <span>Margem (%)</span>
                <input id="margin" type="number" min="0" step="0.01" value="20" />
              </label>

              <label>
                <span>Câmbio (R$ por USD)</span>
                <input id="exchangeRate" type="number" min="0.01" step="0.01" value="5.45" required />
              </label>
            </div>

            <button type="submit" class="primary submit-btn">Gerar cotação</button>
          </form>
        </section>

        <aside class="panel result-panel">
          <h2>Resumo da cotação</h2>

          <div id="resultCard" class="result-card">
            <p class="empty-state">Preencha os dados para ver o cálculo.</p>
          </div>
        </aside>
      </main>

      <section class="panel history-panel">
        <div class="history-header">
          <h2>Histórico</h2>
          <button id="clearHistoryBtn" class="ghost" type="button">Limpar histórico</button>
        </div>

        <div id="historyList" class="history-list">
          <p class="empty-history">Nenhuma cotação salva ainda.</p>
        </div>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
